[project]
    description="A CLI based minecraft mod pack creator/manager"
    license="MIT"
    name="packsmith"
    readme="README.md"
    requires-python=">=3.14,<3.15"
    version="0.2.1"

    dependencies=["httpx>=0.28.1", "pydantic>=2.13.4", "pyfiglet>=1.0.4", "tomli-w>=1.2.0", "typer>=0.26.8"]

    authors=[{name="Frank1o3"}]

    keywords=["cli", "minecraft", "modpack", "modrinth"]

    classifiers=[
        "Development Status :: 3 - Alpha",
        "Environment :: Console",
        "Intended Audience :: Developers",
        "Intended Audience :: End Users/Desktop",
        "License :: OSI Approved :: MIT License",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.14",
        "Topic :: Games/Entertainment",
        "Topic :: Utilities",
    ]

[build-system]
    build-backend="hatchling.build"
    requires=["hatchling"]

[dependency-groups]
    dev=["pre-commit>=4.7.0", "pytest-cov>=7.1.0", "pytest-mock>=3.15.1", "pytest>=9.1.1", "ruff>=0.16.3", "ty>=0.0.71"]

    [project.scripts]
        packsmith="packsmith.main:main"

    [project.urls]
        Homepage="https://github.com/Frank1o3/packsmith"
        Issues="https://github.com/Frank1o3/packsmith/issues"
        Repository="https://github.com/Frank1o3/packsmith"

[tool.uv]
    package=true
