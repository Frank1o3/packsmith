[project]
name = "packsmith"
version = "0.1.4"
description = "A CLI based minecraft mod pack creator/manager"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"

dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyfiglet>=1.0.4",
    "tomli-w>=1.2.0",
    "typer>=0.26.8",
]

authors = [{ name = "Frank1o3" }]

keywords = ["minecraft", "modrinth", "modpack", "cli"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
    "ty>=0.0.55",
]

[project.scripts]
packsmith = "packsmith.main:main"

[project.urls]
Homepage = "https://github.com/Frank1o3/packsmith"
Repository = "https://github.com/Frank1o3/packsmith"
Issues = "https://github.com/Frank1o3/packsmith/issues"

[tool.uv]
package = true
